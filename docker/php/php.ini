; Project overrides on top of php.ini-development.

; Laravel needs more than the 128M default for tinker and larger queries.
; The full APR import still needs: php -d memory_limit=512M artisan apr:import ...
memory_limit = 256M

; Do not reveal the PHP version in HTTP response headers.
expose_php = Off

; Check changed files on every request, so code edits are visible immediately.
opcache.revalidate_freq = 0
